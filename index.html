<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahur OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ base / theme ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font-ui:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --accent:#e0913f; --accent-fg:#1d1409;
  --glass:rgba(33,27,21,.80); --glass-2:rgba(48,39,31,.55);
  --brd:rgba(255,243,226,.09); --brd-2:rgba(255,243,226,.16);
  --fg:#f3ece2; --fg-dim:#b3a493; --fg-faint:#7c6f5e;
  --danger:#e2574f; --ok:#66b38a;
  --shadow-win:0 32px 80px -22px rgba(0,0,0,.75),0 4px 18px rgba(0,0,0,.35);
  --shadow-win-off:0 14px 44px -16px rgba(0,0,0,.55);
}
[data-theme="light"]{
  --glass:rgba(255,252,246,.82); --glass-2:rgba(255,250,240,.7);
  --brd:rgba(62,45,27,.11); --brd-2:rgba(62,45,27,.2);
  --fg:#2c2118; --fg-dim:#6f6353; --fg-faint:#a4907a;
  --shadow-win:0 30px 70px -24px rgba(60,40,20,.45),0 4px 16px rgba(60,40,20,.18);
  --shadow-win-off:0 12px 36px -16px rgba(60,40,20,.35);
}
html{font-size:16px}
body{font-family:var(--font-ui);background:#171310;color:var(--fg);height:100vh;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none}
::selection{background:var(--accent);color:var(--accent-fg)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(140,124,103,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(140,124,103,.35) transparent}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
body.no-anim *{transition:none!important;animation:none!important}

/* ============ desktop ============ */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;z-index:0;transition:opacity .35s}
#icons{position:absolute;inset:0;z-index:1}
#win-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.dicon{position:absolute;width:5.6rem;padding:.45rem .25rem .35rem;border-radius:.75rem;display:flex;flex-direction:column;align-items:center;gap:.28rem}
.dicon .icn{width:3.1rem;height:3.1rem;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.dicon .icn svg{width:100%;height:100%}
.dicon .lbl{font-size:.72rem;line-height:1.25;text-align:center;color:var(--fg);text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 10px rgba(0,0,0,.45);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.dicon.selected{background:color-mix(in srgb,var(--accent) 28%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.dicon .icn,.dicon .lbl{pointer-events:none}

/* ============ windows ============ */
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--brd-2);border-radius:1rem;box-shadow:var(--shadow-win-off);overflow:hidden;min-width:21rem;min-height:13rem}
.win.focused{box-shadow:var(--shadow-win);border-color:color-mix(in srgb,var(--accent) 32%,var(--brd-2))}
.win.opening{animation:winIn .28s cubic-bezier(.2,.9,.25,1.12)}
@keyframes winIn{from{opacity:0;transform:scale(.92) translateY(14px)}}
.win.closing{animation:winOut .2s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.93) translateY(8px)}}
.win.minimized{display:none}
.win.maximized{border-radius:.8rem}
.win.maximized .rs{display:none}
.titlebar{height:2.7rem;flex:none;display:flex;align-items:center;gap:.55rem;padding:0 .45rem 0 .9rem;border-bottom:1px solid var(--brd);cursor:default;background:rgba(255,255,255,.03)}
[data-theme="light"] .titlebar{background:rgba(255,255,255,.35)}
.tb-icon{width:1.1rem;height:1.1rem;flex:none;display:grid;place-items:center}
.tb-icon svg{width:100%;height:100%}
.tb-title{flex:1;min-width:0;font-size:.82rem;font-weight:600;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.win:not(.focused) .tb-title{color:var(--fg-dim)}
.tb-controls{display:flex;gap:2px}
.wc{width:2rem;height:1.85rem;border-radius:.5rem;display:grid;place-items:center;color:var(--fg-dim)}
.wc:hover{background:rgba(128,110,90,.25);color:var(--fg)}
.wc-close:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.rs{position:absolute;z-index:6}
.rs-n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rs-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rs-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rs-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rs-ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rs-nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rs-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.rs-sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}
.drag-ghost{position:fixed;z-index:960000;pointer-events:none;opacity:.95;transform:rotate(-4deg) scale(1.1);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.drop-hint{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 15%,transparent)!important;border-radius:.7rem}

/* ============ dock (macOS style, magnifying) ============ */
#dock{position:fixed;left:50%;bottom:.75rem;transform:translateX(-50%);z-index:900000;display:flex;align-items:flex-end;gap:.55rem;padding:.55rem .7rem;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--brd-2);border-radius:1.4rem;box-shadow:0 18px 50px -12px rgba(0,0,0,.6);max-width:96vw;overflow:visible}
#dock-apps{position:relative;height:2.9rem;flex:none}
.dock-btn{width:2.9rem;height:2.9rem;border-radius:.85rem;display:grid;place-items:center;position:absolute;bottom:0;left:0;flex:none;transition:background .18s;transform-origin:bottom center}
.dock-btn .db-in{display:block;width:100%;height:100%;pointer-events:none}
.dock-btn svg{width:1.9rem;height:1.9rem}
.dock-btn:hover{background:rgba(128,110,90,.18)}
.dock-btn.bounce .db-in{animation:dockBounce .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dockBounce{0%{transform:translateY(0)}35%{transform:translateY(-.95rem) scaleY(1.06)}70%{transform:translateY(.18rem) scaleY(.94)}100%{transform:translateY(0)}}
.dock-btn.running::after{content:'';position:absolute;bottom:.1rem;left:50%;transform:translateX(-50%);width:.32rem;height:.32rem;border-radius:50%;background:var(--accent)}
.dock-btn.active{background:rgba(128,110,90,.22)}
#dock-tip{position:fixed;z-index:960000;transform:translateX(-50%);padding:.3rem .65rem;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--brd-2);border-radius:.55rem;font-size:.74rem;font-weight:600;pointer-events:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.55);white-space:nowrap;animation:tipIn .14s ease}
@keyframes tipIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}}
.dock-sep{width:1px;height:2.1rem;background:var(--brd-2);margin:0 .15rem;flex:none;align-self:center}
.dock-clock{padding:0 .7rem;text-align:center;line-height:1.2;border-radius:.7rem;flex:none;cursor:pointer}
.dock-clock:hover{background:rgba(128,110,90,.18)}
#clock-time{font-size:.92rem;font-weight:700}
#clock-date{font-size:.62rem;color:var(--fg-dim)}
.dock-tray{width:2.2rem;height:2.2rem;border-radius:.65rem;display:grid;place-items:center;color:var(--fg-dim);flex:none}
.dock-tray:hover{background:rgba(128,110,90,.18);color:var(--fg)}

/* ============ popovers ============ */
@keyframes popIn{from{opacity:0;transform:translate(var(--pdx,0),10px) scale(.97)}}
.pop{position:fixed;z-index:911000;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--brd-2);border-radius:1.1rem;padding:.85rem;box-shadow:0 24px 60px -18px rgba(0,0,0,.65);animation:popIn .2s cubic-bezier(.2,.9,.3,1.1);min-width:14rem}

/* ============ context menu ============ */
.ctx{position:fixed;z-index:950000;min-width:13.5rem;padding:.3rem;background:var(--glass);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--brd-2);border-radius:.8rem;box-shadow:0 18px 50px -12px rgba(0,0,0,.65);animation:ctxIn .13s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96) translateY(2px)}}
.ctx-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:.5rem;font-size:.8rem;cursor:pointer;color:var(--fg)}
.ctx-item:hover{background:var(--accent);color:var(--accent-fg)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:var(--danger);color:#fff}
.ctx-item.dis{opacity:.4;cursor:default}
.ctx-item.dis:hover{background:none;color:var(--fg)}
.ctx-item .ci{width:1rem;height:1rem;display:grid;place-items:center;opacity:.85;flex:none}
.ctx-sep{height:1px;background:var(--brd);margin:.3rem .4rem}

/* ============ modal / dialog ============ */
.modal-veil{position:fixed;inset:0;z-index:980000;background:rgba(12,9,6,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:grid;place-items:center;animation:fadeIn .16s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(26rem,92vw);background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--brd-2);border-radius:1.15rem;box-shadow:0 30px 80px -18px rgba(0,0,0,.7);animation:modIn .22s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{width:min(31rem,94vw)}
@keyframes modIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
.modal-title{padding:1rem 1.2rem .35rem;font-weight:700;font-size:1rem}
.modal-body{padding:.45rem 1.2rem 1rem;font-size:.86rem;color:var(--fg-dim);line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;padding:0 1.2rem 1.1rem}
.btn{padding:.5rem .95rem;border-radius:.6rem;font-weight:600;font-size:.82rem;border:1px solid var(--brd-2);background:rgba(128,110,90,.16);color:var(--fg);cursor:pointer}
.btn:hover{background:rgba(128,110,90,.3)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.09)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
/* file picker */
.fp{display:flex;flex-direction:column;min-height:16rem}
.fp-main{display:flex;min-height:14rem;border:1px solid var(--brd);border-radius:.7rem;overflow:hidden}
.fp-side{width:9.5rem;flex:none;border-right:1px solid var(--brd);padding:.4rem;overflow:auto}
.fp-list{flex:1;overflow:auto;padding:.35rem;display:flex;flex-direction:column;gap:1px}
.fp-row{display:flex;align-items:center;gap:.55rem;padding:.38rem .55rem;border-radius:.5rem;font-size:.8rem;cursor:pointer;color:var(--fg)}
.fp-row:hover{background:rgba(128,110,90,.18)}
.fp-row.sel{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.fp-row .icn{width:1.15rem;height:1.15rem;flex:none}
.fp-row .icn svg{width:100%;height:100%}
.fp-foot{display:flex;align-items:center;gap:.5rem;padding-top:.7rem}
.fp-name{flex:1;padding:.45rem .7rem;border-radius:.6rem;background:rgba(128,110,90,.16);border:1px solid var(--brd-2);color:var(--fg);font-size:.82rem;outline:none}
.fp-empty{padding:1.5rem;text-align:center;color:var(--fg-faint);font-size:.78rem}
.place{display:flex;align-items:center;gap:.55rem;padding:.4rem .55rem;border-radius:.55rem;font-size:.78rem;color:var(--fg-dim);cursor:pointer;text-align:left;width:100%}
.place .icn{width:1rem;height:1rem;flex:none;color:var(--accent)}
.place:hover{background:rgba(128,110,90,.16)}
.place.cur{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--fg)}
.side-h{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);padding:.5rem .55rem .25rem}

/* ============ toasts ============ */
#toasts{position:fixed;right:1rem;bottom:5.4rem;z-index:990000;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:.55rem;align-items:center;padding:.6rem .9rem;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--brd-2);border-radius:.8rem;font-size:.8rem;box-shadow:0 14px 40px -10px rgba(0,0,0,.55);animation:toastIn .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
.toast .ci{color:var(--accent);display:grid;place-items:center}

/* ============ finder ============ */
.finder{display:flex;flex-direction:column;height:100%}
.fdr-bar{display:flex;align-items:center;gap:.3rem;padding:.42rem .55rem;border-bottom:1px solid var(--brd);flex:none}
.ibtn{width:1.85rem;height:1.85rem;border-radius:.5rem;display:grid;place-items:center;color:var(--fg-dim);flex:none}
.ibtn:hover{background:rgba(128,110,90,.2);color:var(--fg)}
.ibtn:disabled{opacity:.32;cursor:default}
.ibtn:disabled:hover{background:none}
.ibtn.on{background:var(--accent);color:var(--accent-fg)}
.crumbs{display:flex;align-items:center;gap:.05rem;flex:1;min-width:0;overflow:hidden;font-size:.78rem;padding:0 .3rem}
.crumb{padding:.24rem .42rem;border-radius:.45rem;color:var(--fg-dim);white-space:nowrap;cursor:pointer}
.crumb:hover{background:rgba(128,110,90,.18);color:var(--fg)}
.crumb.cur{color:var(--fg);font-weight:600}
.crumb-sep{color:var(--fg-faint);flex:none}
.fdr-main{flex:1;display:flex;min-height:0}
.fdr-side{width:10.2rem;flex:none;border-right:1px solid var(--brd);padding:.45rem;overflow:auto;display:flex;flex-direction:column;gap:1px}
.fdr-view{flex:1;overflow:auto;padding:.75rem;align-content:start;position:relative}
.fdr-view.grid{display:grid;grid-template-columns:repeat(auto-fill,5.4rem);gap:.35rem}
.fdr-view.list{display:flex;flex-direction:column;gap:1px}
.fi{display:flex;flex-direction:column;align-items:center;gap:.32rem;padding:.5rem .25rem .38rem;border-radius:.7rem;cursor:default}
.fdr-view.list .fi{flex-direction:row;padding:.34rem .6rem;gap:.65rem;align-items:center}
.fi .icn{width:2.45rem;height:2.45rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.22))}
.fdr-view.list .fi .icn{width:1.25rem;height:1.25rem}
.fi .icn svg{width:100%;height:100%}
.fi .lbl{font-size:.72rem;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;color:var(--fg)}
.fdr-view.list .fi .lbl{flex:1;text-align:left;-webkit-line-clamp:1}
.fi .meta{font-size:.66rem;color:var(--fg-faint);white-space:nowrap}
.fi.selected{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.fdr-status{flex:none;border-top:1px solid var(--brd);padding:.32rem .8rem;font-size:.66rem;color:var(--fg-dim);display:flex;justify-content:space-between}
.empty-note{grid-column:1/-1;padding:2.4rem 1rem;text-align:center;color:var(--fg-faint);font-size:.8rem;line-height:1.6}
.rename-input{font-size:.74rem;padding:.2rem .4rem;border-radius:.4rem;border:1px solid var(--accent);background:var(--glass);color:var(--fg);outline:none;width:5rem;text-align:center}

/* ============ text edit ============ */
.tedit{display:flex;flex-direction:column;height:100%}
.te-bar{display:flex;align-items:center;gap:.15rem;padding:.4rem .5rem;border-bottom:1px solid var(--brd);flex:none;flex-wrap:wrap}
.te-group{display:flex;gap:2px;padding:0 .25rem;align-items:center}
.te-group+.te-group{border-left:1px solid var(--brd);margin-left:.25rem;padding-left:.5rem}
.tbtn{width:1.85rem;height:1.85rem;border-radius:.5rem;display:grid;place-items:center;color:var(--fg-dim)}
.tbtn:hover{background:rgba(128,110,90,.2);color:var(--fg)}
.tbtn.on{background:var(--accent);color:var(--accent-fg)}
.te-sel{padding:.28rem .4rem;border-radius:.5rem;background:rgba(128,110,90,.16);border:1px solid var(--brd-2);color:var(--fg);font-size:.74rem;outline:none;cursor:pointer}
.te-sel option{background:#2a221b;color:#eee}
.te-spring{flex:1}
.te-txt{font-size:.76rem;padding:.32rem .7rem;border-radius:.55rem;border:1px solid var(--brd-2);background:rgba(128,110,90,.14);color:var(--fg);font-weight:600}
.te-txt:hover{background:rgba(128,110,90,.28)}
.te-scroll{flex:1;overflow:auto}
.sahur-paper{background:repeating-linear-gradient(0deg,rgba(120,80,45,.06) 0 2px,transparent 2px 27px),repeating-linear-gradient(90deg,rgba(120,80,45,.04) 0 2px,transparent 2px 95px),linear-gradient(180deg,#fbf4e5,#f0e5cd)}
.editor{min-height:100%;padding:2rem 2.4rem;outline:none;font-family:Georgia,'Times New Roman',serif;font-size:1rem;line-height:1.75;color:#33261a;caret-color:var(--accent);-webkit-user-select:text;user-select:text}
.editor:empty::before{content:attr(data-ph);color:#b8a887}
.editor font[size="1"]{font-size:.75rem}
.editor font[size="2"]{font-size:.85rem}
.editor font[size="3"]{font-size:1rem}
.editor font[size="4"]{font-size:1.2rem}
.editor font[size="5"]{font-size:1.5rem}
.editor font[size="6"]{font-size:2rem}
.editor font[size="7"]{font-size:2.6rem}
.te-banner{flex:none;padding:.45rem .9rem;font-size:.74rem;background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--fg);border-bottom:1px solid var(--brd)}

/* ============ paint ============ */
.paint{display:flex;height:100%}
.p-rail{width:3.2rem;flex:none;border-right:1px solid var(--brd);display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.45rem .25rem;overflow:auto}
.ptool{width:2.15rem;height:2.15rem;border-radius:.6rem;display:grid;place-items:center;color:var(--fg-dim)}
.ptool:hover{background:rgba(128,110,90,.2);color:var(--fg)}
.ptool.on{background:var(--accent);color:var(--accent-fg)}
.p-rail .p-sep{height:1px;width:60%;background:var(--brd);margin:.3rem 0}
.p-canvas-wrap{flex:1;min-width:0;overflow:auto;display:grid;place-items:center;padding:1rem;background:radial-gradient(rgba(128,110,90,.14) 1px,transparent 1.4px);background-size:1.4rem 1.4rem}
.paint-cv{background:#fff;border-radius:.4rem;box-shadow:0 12px 34px -10px rgba(0,0,0,.5);max-width:100%;max-height:100%;cursor:crosshair;touch-action:none}
.p-panel{width:10.5rem;flex:none;border-left:1px solid var(--brd);padding:.7rem .65rem;display:flex;flex-direction:column;gap:.7rem;overflow:auto}
.p-lbl{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint)}
.p-color{width:100%;height:2.4rem;border-radius:.6rem;border:1px solid var(--brd-2);background:none;padding:0;cursor:pointer}
.p-color::-webkit-color-swatch-wrapper{padding:2px}
.p-color::-webkit-color-swatch{border:none;border-radius:.45rem}
.p-color::-moz-color-swatch{border:none;border-radius:.45rem}
.p-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:.32rem}
.swatch{width:1.3rem;height:1.3rem;border-radius:.42rem;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.1rem;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:.3rem;border-radius:.2rem;background:rgba(128,110,90,.3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:.95rem;height:.95rem;border-radius:50%;background:var(--accent);margin-top:-.33rem;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ============ GTA window ============ */
.gta{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;background:radial-gradient(800px 520px at 50% 0%,#3a2c4a,#120d18 72%);text-align:center;padding:1rem}

.sysx{position:fixed;inset:0;z-index:999970;background:#0a0806;color:#f3ece2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;font-family:var(--font-ui);animation:sysxIn .5s}

.glitching #desktop{animation:glitchShake .1s infinite}

/* ============ BIOS ============ */
.bios{position:fixed;inset:0;z-index:999970;background:#060300;color:#ffb000;font-family:var(--font-mono);padding:2rem 2.6rem;font-size:.92rem;line-height:1.75;-webkit-user-select:none;user-select:none}
.bios-scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 5px);mix-blend-mode:multiply;animation:crtFlicker 3.2s infinite}
@keyframes crtFlicker{0%,100%{opacity:.55}50%{opacity:.75}}
.bios-tabs{display:flex;gap:2.4rem;margin:.5rem 0 1.1rem;border-bottom:1px double #7a5200;padding-bottom:.45rem}

.bios-tab.on{color:#ffb000;font-weight:700;background:#3a2500;padding:0 .4rem}
.bios-item{cursor:pointer;padding:.1rem .5rem;width:fit-content}

.bios-warn{border:2px double #7a5200;padding:1rem 1.2rem;margin-top:1.2rem;max-width:34rem}

/* ============ error cascade & panic ============ */
.sysx-err{position:fixed;z-index:999960;width:19.5rem;background:#efe6d8;color:#33261a;border:1px solid #7c6f5e;border-radius:.4rem;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);font-size:.78rem;animation:errIn .1s ease}

/* ===================== sound (WebAudio, all synthesized) ===================== */
const Sound = {
  ctx: null, master: null,
  init(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.master){ this.master.gain.value = Store.state.settings.volume; }
    else if (this.ctx){ this.master = this.ctx.createGain(); this.master.gain.value = Store.state.settings.volume; this.master.connect(this.ctx.destination); }
  },
  setVolume(v){ if (this.master) this.master.gain.value = v; },
  tone(freq, t0, dur, type='sine', vol=0.08, glideTo=null){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  tung(at){
    if (!this.ctx) return;
    const t = at || this.ctx.currentTime;
    this.tone(185, t, 0.16, 'sine', 0.5, 70);
    // knock transient
    const len = this.ctx.sampleRate * 0.03, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1600; bp.Q.value = 1.2;
    const g = this.ctx.createGain(); g.gain.value = 0.22;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
  },
  play(name){
    if (!Store.state.settings.sound) return;
    this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    switch(name){
      case 'tung': this.tung(); gameTung(); break;
      case 'beep': this.tone(880, t, .06, 'square', .045); break;
      case 'alarm': this.tone(196, t, .5, 'sawtooth', .06, 98); this.tone(196, t+.6, .5, 'sawtooth', .06, 98); break;
      case 'glitch': [0,1,2,3,4,5].forEach(i => this.tone(120 + Math.random()*900, t + i*.045, .05, 'sawtooth', .05)); break;
      case 'siren': this.tone(880, t, .8, 'sawtooth', .05, 220); this.tone(880, t+.85, .8, 'sawtooth', .05, 220); break;
      case 'jingle':
        this.tung(t);
        [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>this.tone(f, t+.3+i*.11, .45, 'triangle', .08));
        break;
      case 'open': this.tone(520, t, .09, 'sine', .06, 660); this.tone(780, t+.06, .1, 'sine', .05); break;
      case 'close': this.tone(600, t, .1, 'sine', .06, 380); break;
      case 'min': this.tone(500, t, .16, 'sine', .06, 180); break;
      case 'tick': this.tone(1800, t, .03, 'square', .025); break;
      case 'error': this.tone(180, t, .12, 'square', .05); this.tone(150, t+.13, .14, 'square', .05); break;
      case 'startup':
        this.tung(t); this.tung(t+.28); this.tung(t+.56);
        [146.83, 220, 293.66, 440].forEach((f,i)=>this.tone(f, t+.92+i*.09, .5, 'triangle', .09));
        break;
    }
  }
};

/* ===================== store & settings ===================== */
const KEY = 'sahuros.v2';
const Store = {
  state: null, firstRun: false, _t: null,
  defaults(){
    return { v:2, settings:{ theme:'dark', accent:'#e0913f', wallpaper:'sahur', customColor:'#e0913f',
              density:1, motion:true, sound:true, volume:0.6 },
             notes:[], fs:null,
             game:{ started:null, attempts:0, tungs:0, visited:[],
                    flags:{ downloaded:false, defenderOff:false, installed:false } } };
  },
  load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw){ const d = JSON.parse(raw); if (d && d.v===2 && d.fs){ this.state = d; this.state.game = Object.assign(this.defaults().game, this.state.game || {}); return; } }
    } catch(e){}
    this.state = this.defaults();
    this.state.fs = seedFS();
    this.firstRun = true;
  },
  save(){ try { localStorage.setItem(KEY, JSON.stringify(this.state)); } catch(e){} },
  schedule(){ clearTimeout(this._t); this._t = setTimeout(()=>this.save(), 350); }
};
const S = () => Store.state.settings;

/* ===================== run meta (survives wipes) & game helpers ===================== */
const MKEY = 'sahuros.meta.v1';
const Meta = {
  get(){ try { return JSON.parse(localStorage.getItem(MKEY)) || {}; } catch(e){ return {}; } },
  set(m){ try { localStorage.setItem(MKEY, JSON.stringify(m)); } catch(e){} }
};
const G = () => Store.state.game;
function gameTung(){ G().tungs++; }
function gameVisit(url){ const g = G(); if (!g.visited.includes(url)){ g.visited.push(url); } Store.schedule(); }
function startRunTimer(){ if (!G().started){ G().started = Date.now(); Store.schedule(); } }
function runElapsed(){ return Date.now() - (G().started || BOOT_TIME); }
function fmtRunTime(ms){
  const cs = Math.floor(ms/10) % 100, s = Math.floor(ms/1000) % 60, m = Math.floor(ms/60000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function wipeRun(){ // the restore wins: erase the save, keep only meta
  const m = Meta.get();
  m.runs = (m.runs || 0) + 1;
  Meta.set(m);
  localStorage.removeItem(KEY);
  location.reload();
}

function rr(x, X, Y, W, H, R){
  x.beginPath();
  x.moveTo(X+R, Y); x.arcTo(X+W, Y, X+W, Y+H, R); x.arcTo(X+W, Y+H, X, Y+H, R);
  x.arcTo(X, Y+H, X, Y, R); x.arcTo(X, Y, X+W, Y, R); x.closePath();
}

/* ===================== event bus ===================== */
const Bus = {
  _m: {},
  on(t, f){ (this._m[t] ||= []).push(f); return () => { this._m[t] = (this._m[t]||[]).filter(x => x !== f); }; },
  emit(t, p){ (this._m[t] || []).slice().forEach(f => { try { f(p); } catch(e){ console.warn(e); } }); }
};

/* ===================== virtual file system ===================== */
const rootN = () => Store.state.fs;
const folderId = name => { const n = rootN().children.find(c => c.name === name); return n ? n.id : null; };
const deskId = () => folderId('Desktop');

function findNode(id, from = rootN()){
  if (!id) return null;
  if (from.id === id) return from;
  for (const c of from.children){ const r = findNode(id, c); if (r) return r; }
  return null;
}
function childrenOf(id){
  const n = findNode(id);
  if (!n || n.type !== 'folder') return [];
  return [...n.children].sort((a,b) => a.type === b.type
    ? a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:'base' })
    : (a.type === 'folder' ? -1 : 1));
}
function pathOf(n){
  if (!n || !n.parentId) return '/';
  const parts = []; let c = n;
  while (c && c.parentId){ parts.unshift(c.name); c = findNode(c.parentId); }
  return '/' + parts.join('/');
}
function resolvePath(str, cwdId){
  str = (str || '').trim();
  if (!str) return findNode(cwdId) || rootN();
  let base;
  if (str === '~' || str === '/') return rootN();
  if (str.startsWith('~/')){ base = rootN(); str = str.slice(2); }
  else if (str.startsWith('/')){ base = rootN(); str = str.slice(1); }
  else base = findNode(cwdId) || rootN();
  let cur = base;
  for (const p of str.split('/').filter(s => s && s !== '.')){
    if (p === '..'){ cur = cur.parentId ? findNode(cur.parentId) : cur; continue; }
    const nx = cur.children.find(c => c.name === p);
    if (!nx) return null;
    cur = nx;
  }
  return cur;
}
function uniqueName(parentId, base, ext=''){
  const sibs = childrenOf(parentId).map(c => c.name);
  if (!sibs.includes(base + ext)) return base + ext;
  let i = 2;
  while (sibs.includes(`${base} ${i}${ext}`)) i++;
  return `${base} ${i}${ext}`;
}
function isDescendant(anc, id){
  let c = findNode(id);
  while (c && c.parentId){
    if (c.parentId === anc.id) return true;
    c = findNode(c.parentId);
  }
  return false;
}
function fsChanged(){ Store.schedule(); Bus.emit('fs'); }

function createFolder(parentId, name){
  const p = findNode(parentId);
  if (!p || p.type !== 'folder') return null;
  const n = { id: uid(), name, type:'folder', kind:null, content:'', children:[], parentId, x:undefined, y:undefined, created:Date.now(), modified:Date.now() };
  p.children.push(n); fsChanged(); return n;
}
function createFile(parentId, name, kind, content=''){
  const p = findNode(parentId);
  if (!p || p.type !== 'folder') return null;
  const n = { id: uid(), name, type:'file', kind, content, children:[], parentId, x:undefined, y:undefined, created:Date.now(), modified:Date.now() };
  p.children.push(n); fsChanged(); return n;
}
function renameNode(id, name){
  const n = findNode(id); if (!n) return;
  const v = (name || '').trim();
  if (!v) throw new Error('Name cannot be empty');
  if (v.includes('/')) throw new Error('Name cannot contain "/"');
  if (n.parentId){
    const clash = childrenOf(n.parentId).find(c => c.id !== id && c.name === v);
    if (clash) throw new Error(`"${v}" already exists here`);
  }
  n.name = v; n.modified = Date.now(); fsChanged();
}
function moveNode(id, newParentId){
  const n = findNode(id), p = findNode(newParentId);
  if (!n || !p || p.type !== 'folder') return false;
  if (n.id === newParentId || isDescendant(n, newParentId)) return false;
  const old = findNode(n.parentId);
  if (old) old.children = old.children.filter(c => c.id !== id);
  p.children.push(n); n.parentId = newParentId; n.modified = Date.now();
  fsChanged(); return true;
}
function deleteNode(id){
  const n = findNode(id); if (!n || !n.parentId) return;
  const p = findNode(n.parentId);
  p.children = p.children.filter(c => c.id !== id);
  fsChanged();
}
function writeFile(id, content){
  const n = findNode(id); if (!n) return;
  n.content = content; n.modified = Date.now(); fsChanged();
}
function openNode(n){
  if (!n) return;
  if (n.type === 'folder') openApp('finder', { cwd: n.id });
  else if (n.kind === 'text') openApp('textedit', { fileId: n.id });
  else if (n.kind === 'image') openApp('viewer', { fileId: n.id });
  else if (n.kind === 'apk') handleApkOpen(n);
  else if (n.kind === 'game') openApp('gta');
  else toast('No app can open this file', 'info');
}

/* ===================== dialogs ===================== */
const dialogStack = [];
function dialog({ title, body, buttons, wide }){
  return new Promise(res => {
    const veil = h('div', { class:'modal-veil' });
    const m = h('div', { class:'modal' + (wide ? ' wide' : '') },
      h('div', { class:'modal-title' }, title),
      h('div', { class:'modal-body' }, body),
      h('div', { class:'modal-actions' },
        buttons.map(b => h('button', { class:'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''),
          onclick: () => finish(b.value) }, b.label))));
    veil.append(m); document.body.append(veil);
    dialogStack.push(veil);
    const esc = e => { if (e.key === 'Escape' && dialogStack[dialogStack.length-1] === veil) finish(null); };
    document.addEventListener('keydown', esc, true);
    function finish(v){
      const i = dialogStack.indexOf(veil); if (i > -1) dialogStack.splice(i, 1);
      document.removeEventListener('keydown', esc, true);
      veil.remove(); res(v);
    }
    const prim = m.querySelector('.btn.primary'); if (prim) setTimeout(() => prim.focus(), 40);
  });
}
const confirmDialog = (title, msg, ok='OK', danger=false) =>

      }}, 'Save');
      nameInp.addEventListener('input', validate);
      nameInp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') okBtn.click(); });
    } else {

    const m = h('div', { class:'modal wide' },
      h('div', { class:'modal-title' }, title || (mode === 'open' ? 'Open file' : 'Save file')),

            h('button', { class:'btn', onclick:() => finish(null) }, 'Cancel')))));
    veil.append(m); document.body.append(veil);

    document.addEventListener('keydown', esc, true);

function topWindow(){
  let best = null;
  for (const w of WM.wins) if (!w.minimized && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w;
  return best;
}
function focusWin(w){
  if (!w || w.closing) return;

function dockTargetRect(appId){

function setRect(w, x, y, wd, ht){

function animateRect(w, r){

function minimizeWin(w){

  const dx = (to.left + to.width/2) - (from.left + from.width/2);
  const dy = (to.top + to.height/2) - (from.top + from.height/2);

function restoreWin(w){

const RSDIRS = ['n','s','e','w','ne','nw','se','sw'];
function createWindow(app, opts={}){
  const w = { id: uid('w'), appId: app.id, minimized:false, maximized:false, prev:null, closing:false, state:{}, subs:[], timers:[], opts };
  const dw = Math.min(app.w, innerWidth - 30), dh = Math.min(app.h, innerHeight - 110);
  const off = WM.wins.length % 7;
  let x = Math.round((innerWidth - dw)/2 + (off - 3) * 34);
  let y = Math.round(Math.max(10, (innerHeight - dh - 84)/2 + (off % 3 - 1) * 24));
  x = clamp(x, 8, Math.max(8, innerWidth - dw - 8));
  y = clamp(y, 8, Math.max(8, innerHeight - dh - 60));

  const el = h('div', { class:'win opening' });
  Object.assign(el.style, { left:x+'px', top:y+'px', width:dw+'px', height:dh+'px', zIndex:++WM.z });
  const titleEl = h('div', { class:'tb-title' }, app.name);
  const tb = h('div', { class:'titlebar' },
    h('span', { class:'tb-icon', html: appIcon(app.tile, 18) }),
    titleEl,
    h('div', { class:'tb-controls' },
      h('button', { class:'wc wc-min', title:'Minimize', onclick:() => minimizeWin(w) }, icon('minus', 14)),
      h('button', { class:'wc wc-max', title: w=>'' || 'Maximize', onclick:() => toggleMax(w) }, icon('square', 12)),
      h('button', { class:'wc wc-close', title:'Close', onclick:() => closeWin(w) }, icon('close', 14))));
  const body = h('div', { class:'win-body' });
  el.append(tb, body);
  RSDIRS.forEach(dir => {
    const hd = h('div', { class:'rs rs-' + dir });
    hd.addEventListener('pointerdown', e => startResize(w, e, dir, app));
    el.append(hd);
  });
  el.addEventListener('pointerdown', () => focusWin(w), true);
  // drag
  tb.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.wc')) return;
    startWinDrag(w, e);
  });
  tb.addEventListener('dblclick', e => { if (!e.target.closest('.wc')) toggleMax(w); });
  $('#win-layer').append(el);
  setTimeout(() => el.classList.remove('opening'), 340);

  w.el = el; w.body = body;
  w.setTitle = t => { titleEl.textContent = t; };
  w.subscribe = (evt, fn) => { const off = Bus.on(evt, fn); w.subs.push(off); return off; };
  w.addInterval = (fn, ms) => { const id = setInterval(fn, ms); w.timers.push(id); return id; };

  WM.wins.push(w);
  try { app.render(w, opts); } catch(e){ console.error(e); body.append(h('div', { class:'empty-note' }, 'This app crashed. It happens.')); }
  focusWin(w);
  Sound.play('open');
  return w;
}
function startWinDrag(w, e){
  w.el.style.transition = '';
  let ax = e.clientX - w.el.offsetLeft, ay = e.clientY - w.el.offsetTop;
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  const tb = e.currentTarget;
  tb.setPointerCapture(e.pointerId);
  const mv = ev => {
    if (!moved){
      if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 4) return;
      moved = true;
      if (w.maximized){
        const gr = (ev.clientX - w.el.getBoundingClientRect().left) / w.el.offsetWidth;
        w.maximized = false; w.el.classList.remove('maximized');
        const pw = w.prev.w, ph = w.prev.h;
        setRect(w, Math.round(ev.clientX - pw*gr), Math.max(0, Math.round(ev.clientY - 18)), pw, ph);
        ax = pw * gr; ay = 18;
        return;
      }
    }
    w.el.style.left = clamp(ev.clientX - ax, 150 - w.el.offsetWidth, innerWidth - 150) + 'px';
    w.el.style.top  = clamp(ev.clientY - ay, 0, innerHeight - 48) + 'px';
  };
  const up = () => { tb.removeEventListener('pointermove', mv); };
  tb.addEventListener('pointermove', mv);
  tb.addEventListener('pointerup', up, { once:true });
  tb.addEventListener('pointercancel', up, { once:true });
}
function startResize(w, e, dir, app){
  if (w.maximized) return;
  e.stopPropagation(); focusWin(w);
  w.el.style.transition = '';
  const s = { x:e.clientX, y:e.clientY, l:w.el.offsetLeft, t:w.el.offsetTop, w:w.el.offsetWidth, h:w.el.offsetHeight };
  const minW = app.minW || 340, minH = app.minH || 220;
  const hd = e.currentTarget;
  hd.setPointerCapture(e.pointerId);
  const mv = ev => {
    const dx = ev.clientX - s.x, dy = ev.clientY - s.y;
    let L = s.l, T = s.t, W = s.w, H = s.h;
    if (dir.includes('e')) W = s.w + dx;
    if (dir.includes('s')) H = s.h + dy;
    if (dir.includes('w')){ W = s.w - dx; L = s.l + dx; }
    if (dir.includes('n')){ H = s.h - dy; T = s.t + dy; }
    if (W < minW){ if (dir.includes('w')) L = s.l + s.w - minW; W = minW; }
    if (H < minH){ if (dir.includes('n')) T = s.t + s.h - minH; H = minH; }
    if (T < 0){ H += T; T = 0; }
    setRect(w, L, T, W, H);
  };
  const up = () => hd.removeEventListener('pointermove', mv);
  hd.addEventListener('pointermove', mv);
  hd.addEventListener('pointerup', up, { once:true });
}

const Apps = {};

function openApp(appId, opts={}){
  const app = Apps[appId];
  if (!app) return null;
  if (app.single){
    const ex = WM.wins.find(w => w.appId === appId);
    if (ex){
      if (ex.minimized) restoreWin(ex); else focusWin(ex);
      if (app.onReopen) app.onReopen(ex, opts);

}

/* ===================== dock (macOS magnification) / tray ===================== */
const PINNED = ['finder','browser','textedit','paint','notes','terminal','calc','settings'];
const DockFX = {
  base:46, gap:8, maxScale:1.62, effect:210,
  mouseX:null, scales:[], raf:0, tip:null,
  bind(){
    const wrap = $('#dock-apps');
    const btns = $$('.dock-btn', wrap);
    this.base = innerWidth < 700 ? 36 : 46;
    this.gap  = innerWidth < 700 ? 5 : 8;
    this.effect = Math.round(this.base * 4.6);
    btns.forEach((b, i) => {
      b.style.position = 'absolute'; b.style.bottom = '0';
      b.style.left = (i * (this.base + this.gap)) + 'px';
    });
    this.scales = btns.map(() => 1);
    wrap.style.width  = (btns.length * (this.base + this.gap) - this.gap) + 'px';
    wrap.style.height = this.base + 'px';
    this.layout();
    this.wake();
  },
  baseCenters(){ return this.scales.map((_, i) => i * (this.base + this.gap) + this.base / 2); },
  targets(){
    if (this.mouseX == null) return this.scales.map(() => 1);
    const min = this.mouseX - this.effect / 2, max = this.mouseX + this.effect / 2;
    return this.baseCenters().map(c => {
      if (c < min || c > max) return 1;
      const th = ((c - min) / this.effect) * 2 * Math.PI;
      const f = (1 - Math.cos(Math.min(Math.max(th, 0), 2 * Math.PI))) / 2;
      return 1 + f * (this.maxScale - 1);
    });
  },
  layout(){
    const wrap = $('#dock-apps'); if (!wrap) return;
    const btns = $$('.dock-btn', wrap);
    let x = 0;
    const centers = this.scales.map(s => { const w = this.base * s; const c = x + w / 2; x += w + this.gap; return c; });
    if (btns.length) wrap.style.width = Math.round(x - this.gap) + 'px';
    btns.forEach((b, i) => {
      if (this.scales[i] == null) return;
      const bc = i * (this.base + this.gap) + this.base / 2;
      b.style.transform = `translateX(${(centers[i] - bc).toFixed(2)}px) scale(${this.scales[i].toFixed(4)})`;
      b.style.zIndex = Math.round(this.scales[i] * 10);
    });
  },
  wake(){
    cancelAnimationFrame(this.raf);
    const step = () => {
      const t = this.targets();
      const lf = this.mouseX != null ? .3 : .18;
      let settled = true;
      this.scales = this.scales.map((s, i) => {
        const d = t[i] - s;
        if (Math.abs(d) > .0015) settled = false;
        return s + d * lf;
      });
      this.layout();
      if (!settled || this.mouseX != null) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  showTip(btn){
    const app = Apps[btn.dataset.app]; if (!app) return;
    this.hideTip();
    const tip = h('div', { id:'dock-tip' }, app.name);
    document.body.append(tip);
    const r = btn.getBoundingClientRect();
    tip.style.left = (r.left + r.width / 2) + 'px';
    tip.style.top  = (r.top - 30) + 'px';
    this.tip = tip;
  },
  hideTip(){ if (this.tip){ this.tip.remove(); this.tip = null; } }
};
function renderDock(){

/* ===================== desktop icons & file dragging ===================== */
const Desk = { sel: null };
function updateSelClasses(){
  $$('#icons .dicon').forEach(el => el.classList.toggle('selected', el.dataset.node === Desk.sel));
}
function autoPositions(kids){
  const taken = new Set();
  kids.forEach(n => { if (n.x != null) taken.add(Math.round(n.x/96) + ':' + Math.round(n.y/106)); });
  let cell = 0;
  return kids.map(n => {
    if (n.x != null) return { x:n.x, y:n.y };
    while (true){
      const col = cell % 6, rowI = Math.floor(cell/6); cell++;
      const key = col + ':' + rowI;
      if (!taken.has(key)){ taken.add(key); return { x: 16 + col*96, y: 14 + rowI*106 }; }
    }
  });
}
function renderDesktop(){
  const layer = $('#icons');
  layer.innerHTML = '';
  if (!rootN()) return;
  const kids = childrenOf(deskId());
  const pos = autoPositions(kids);
  kids.forEach((n, i) => {
    const el = h('div', { class:'dicon' + (Desk.sel === n.id ? ' selected' : ''), 'data-node':n.id,
      style:{ left:pos[i].x + 'px', top:pos[i].y + 'px' } },
      h('div', { class:'icn', html: fileIconHTML(n) }),
      h('div', { class:'lbl' }, n.name));

    });
    el.addEventListener('dblclick', () => openNode(n));
    if (n.type === 'folder') el.dataset.drop = n.id;
    makeDraggable(el, n, { freeDrop:true });
    layer.append(el);
  });
  updateSelClasses();
}
function makeGhost(node){

function dropTargetAt(x, y, node){
  const els = document.elementsFromPoint(x, y);
  for (const el of els){
    const de = el.closest && el.closest('[data-drop]');
    if (!de) continue;
    const tid = de.dataset.drop;
    if (tid === node.id) continue;
    const tn = findNode(tid);
    if (!tn || tn.type !== 'folder') continue;
    return de;
  }
  return null;
}
function handleDrop(node, targetId){

  if (isDescendant(node, targetId)) return toast("A folder can't move inside itself", 'info');
  if (moveNode(node.id, targetId)){

    const move = ev => {
      if (!dragging){
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
        dragging = true;
        ghost = makeGhost(node); document.body.append(ghost);
      }
      ghost.style.left = (ev.clientX + 10) + 'px';
      ghost.style.top  = (ev.clientY + 8)  + 'px';
      const t = dropTargetAt(ev.clientX, ev.clientY, node);
      if (t !== target){
        if (target) target.classList.remove('drop-hint');
        target = t;
        if (target) target.classList.add('drop-hint');
      }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (ghost) ghost.remove();
      if (target) target.classList.remove('drop-hint');
      if (!dragging) return;
      if (target){ handleDrop(node, target.dataset.drop); return; }
      if (opts.freeDrop){
        node.x = clamp(ev.clientX - 28, 4, innerWidth - 96);
        node.y = clamp(ev.clientY - 22, 4, innerHeight - 170);
        fsChanged();
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}
function startRename(n){
  const label = document.querySelector(`[data-node="${n.id}"] .lbl`);
  if (!label) return renameDialog(n);
  beginRename(label, n);
}
function beginRename(labelEl, node){
  const inp = h('input', { class:'rename-input', value: node.name, spellcheck:'false' });
  labelEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    const v = inp.value.trim();
    inp.replaceWith(labelEl);
    if (!v || v === node.name) return;
    try { renameNode(node.id, v); } catch(err){ toast(err.message, 'info'); Sound.play('error'); }
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape'){ done = true; inp.replaceWith(labelEl); }
  });
  inp.addEventListener('blur', commit);
  inp.addEventListener('pointerdown', e => e.stopPropagation());
}

let _stampImg = null;
function getStampImg(){
  if (!_stampImg){
    _stampImg = new Image();
    _stampImg.src = ASSETS.mascot || svgURI(mascotSVG({ w:160, h:213 }));
  }

registerApp({
  id:'paint', name:'Tung Paint', tile:'paint', kw:'paint draw canvas brush art',
  w:880, h:620, minW:580, minH:440, single:false,
  render(win){
    const st = win.state = { tool:'brush', color:'#d9603b', size:8, undo:[], redo:[], busy:false };
    const cv = document.createElement('canvas');
    cv.width = 960; cv.height = 600; cv.className = 'paint-cv';
    const ctx = cv.getContext('2d', { willReadFrequently:true });
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 960, 600);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const snapshot = () => {
      st.undo.push(cv.toDataURL('image/png'));
      if (st.undo.length > 25) st.undo.shift();
      st.redo.length = 0;
    };
    const drawSnap = (url, cb) => {
      const img = new Image();
      img.onload = () => { ctx.clearRect(0,0,960,600); ctx.drawImage(img, 0, 0); st.busy = false; cb && cb(); };
      img.src = url;
    };
    const undo = () => { if (st.busy || !st.undo.length) return; st.busy = true;
      st.redo.push(cv.toDataURL('image/png')); drawSnap(st.undo.pop()); };
    const redo = () => { if (st.busy || !st.redo.length) return; st.busy = true;
      st.undo.push(cv.toDataURL('image/png')); drawSnap(st.redo.pop()); };

    function canvasPos(e){
      const r = cv.getBoundingClientRect();
      return { x: Math.round((e.clientX - r.left) * cv.width / r.width), y: Math.round((e.clientY - r.top) * cv.height / r.height) };
    }
    let drawing = false, last = null;
    cv.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      const p = canvasPos(e);
      if (st.tool === 'stamp'){ placeStamp(p.x, p.y); return; }
      if (st.tool === 'fill'){ snapshot(); floodFill(p.x, p.y, st.color); return; }
      snapshot();
      drawing = true; last = p;
      ctx.strokeStyle = st.tool === 'eraser' ? '#ffffff' : st.color;
      ctx.lineWidth = st.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + .01, p.y + .01); ctx.stroke();
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = canvasPos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    });
    cv.addEventListener('pointerup', () => { drawing = false; });

    function placeStamp(x, y){
      snapshot();
      const img = getStampImg();
      const doDraw = () => {
        const s = 50 + st.size * 4.5;
        ctx.save(); ctx.translate(x, y); ctx.rotate((Math.random() - .5) * .5);
        ctx.drawImage(img, -s/2, -s*.66, s, s*1.33);
        ctx.restore();
        Sound.play('tung');
      };
      if (img.complete) doDraw(); else img.addEventListener('load', doDraw, { once:true });
    }
    function hexToRgb(hex){
      const n = parseInt(hex.slice(1), 16);
      return [(n>>16)&255, (n>>8)&255, n&255];
    }
    function floodFill(x, y, hex){
      const W = cv.width, H = cv.height;
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      const img = ctx.getImageData(0, 0, W, H), d = img.data;
      const i0 = (y*W + x) * 4;
      const tr = d[i0], tg = d[i0+1], tb = d[i0+2];
      const [fr, fg, fb] = hexToRgb(hex);
      if (tr === fr && tg === fg && tb === fb) return;
      const stack = [[x, y]];
      while (stack.length){
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
        const i = (cy*W + cx) * 4;
        if (d[i] !== tr || d[i+1] !== tg || d[i+2] !== tb) continue;
        d[i] = fr; d[i+1] = fg; d[i+2] = fb; d[i+3] = 255;
        stack.push([cx+1,cy], [cx-1,cy], [cx,cy+1], [cx,cy-1]);
      }
      ctx.putImageData(img, 0, 0);
    }

    // tool rail
    const mkTool = (ic, tool, title) => {
      const b = h('button', { class:'ptool' + (st.tool === tool ? ' on' : ''), title }, icon(ic, 17));
      b.addEventListener('click', () => { st.tool = tool; $$('.ptool', rail).forEach(x => x.classList.remove('on')); b.classList.add('on'); });
      return b;
    };
    const rail = h('div', { class:'p-rail' },
      mkTool('brush','brush','Brush'), mkTool('eraser','eraser','Eraser'),
      mkTool('fill','fill','Fill bucket'), mkTool('stamp','stamp','Tung stamp'),
      h('div', { class:'p-sep' }),
      h('button', { class:'ptool', title:'Undo', onclick:undo }, icon('undo', 16)),
      h('button', { class:'ptool', title:'Redo', onclick:redo }, icon('redo', 16)),
      h('button', { class:'ptool', title:'Clear canvas', onclick:() => {
        snapshot(); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,960,600);

/* ===================== APP: Calculator ===================== */
registerApp({
  id:'calc', name:'Calculator', tile:'calc', kw:'calculator math numbers',
  w:280, h:420, minW:240, minH:340, single:false,
  render(win){
    const st = { cur:'0', acc:null, op:null, fresh:true, expr:'' };
    const exprEl = h('div', { class:'calc-expr' });
    const curEl = h('div', { class:'calc-cur' }, '0');
    const show = () => { exprEl.textContent = st.expr; curEl.textContent = st.cur; };
    const OPS = { '+':(a,b)=>a+b, '−':(a,b)=>a-b, '×':(a,b)=>a*b, '÷':(a,b)=>b===0?NaN:a/b };
    const SYM = { '+':'+', '-':'−', '*':'×', '/':'÷' };
    function digit(d){
      if (st.fresh){ st.cur = d === '.' ? '0.' : d; st.fresh = false; }
      else if (d === '.' ){ if (!st.cur.includes('.')) st.cur += '.'; }
      else if (st.cur === '0') st.cur = d;
      else if (st.cur.replace('-','').replace('.','').length < 12) st.cur += d;
      show();
    }
    function setOp(op){
      if (st.op && !st.fresh) compute();
      else st.acc = parseFloat(st.cur);
      st.op = op; st.fresh = true;
      st.expr = st.acc + ' ' + op;
      show();
    }
    function compute(){
      if (st.op == null) return;
      const r = OPS[st.op](st.acc, parseFloat(st.cur));
      st.cur = isNaN(r) ? 'no.' : String(+r.toPrecision(12));
      st.acc = null; st.op = null; st.expr = '';
    }
    function equals(){ compute(); st.fresh = true; show(); }
    function clearAll(){ st.cur='0'; st.acc=null; st.op=null; st.fresh=true; st.expr=''; show(); }
    const KEYS = [['C','fn'],['±','fn'],['%','fn'],['÷','op'],
      ['7'],['8'],['9'],['×','op'], ['4'],['5'],['6'],['−','op'],
      ['1'],['2'],['3'],['+','op'], ['0'],['.'],['⌫','fn'],['=','eq']];
    const grid = h('div', { class:'calc-grid' });
    KEYS.forEach(([k, cls]) => {
      const b = h('button', { class:'ck' + (cls ? ' ' + cls : '') }, k);
      b.addEventListener('click', () => press(k));
      grid.append(b);
    });
    const press = k => {
      Sound.play('tick');
      if (/[0-9.]/.test(k) && k.length === 1) return digit(k);
      if (k === 'C') return clearAll();
      if (k === '⌫'){ st.cur = st.cur.length > 1 ? st.cur.slice(0,-1) : '0'; return show(); }
      if (k === '±'){ st.cur = st.cur.startsWith('-') ? st.cur.slice(1) : (st.cur === '0' ? '0' : '-'+st.cur); return show(); }
      if (k === '%'){ st.cur = String(parseFloat(st.cur)/100); return show(); }
      if (k === '=') return equals();
      if (SYM[k]) return setOp(k);
    };
    win.body.append(h('div', { class:'calc' }, h('div', { class:'calc-disp' }, exprEl, curEl), grid));
    win._calcPress = press;
  },
  onKey(win, e){
    const p = win._calcPress; if (!p) return;
    const k = e.key;
    if (/^[0-9.]$/.test(k)) { p(k); e.preventDefault(); }
    else if (['+','-','*','/'].includes(k)) { p(k); e.preventDefault(); }
    else if (k === 'Enter' || k === '=') { p('='); e.preventDefault(); }
    else if (k === 'Backspace') { p('⌫'); e.preventDefault(); }
    else if (k === 'Escape') { p('C'); e.preventDefault(); }
  },
});

/* ===================== APP: Terminal (tungsh) ===================== */
registerApp({
  id:'terminal', name:'Terminal', tile:'term', kw:'terminal shell console command',
  w:680, h:430, minW:420, minH:260, single:false,
  render(win, opts){
    const st = win.state = { cwd: (opts.cwd && findNode(opts.cwd)) ? opts.cwd : rootN().id, hist:[], hi:0 };
    const out = h('div', { class:'term-out' });
    const promptEl = h('span', { class:'term-prompt' });
    const input = h('input', { type:'text', spellcheck:'false', autocomplete:'off' });
    const root = h('div', { class:'term' }, out, h('div', { class:'term-in' }, promptEl, input));
    win.body.append(root);
    root.addEventListener('click', () => { if (window.getSelection().isCollapsed) input.focus(); });

    const shortPath = () => { const p = pathOf(findNode(st.cwd)); return p === '/' ? '~' : p; };
    const setPrompt = () => { promptEl.textContent = `sahur@sahuros ${shortPath()} >`; };
    const print = (txt, cls) => {
      const d = h('div', {}, txt);
      if (cls) d.className = cls;
      out.append(d); out.scrollTop = out.scrollHeight;
    };
    const printHTML = html => { const d = h('div', {}); d.innerHTML = html; out.append(d); out.scrollTop = out.scrollHeight; };

    function run(line){
      printHTML(`<span class="t-acc">sahur@sahuros ${shortPath()} &gt;</span> ${esc(line)}`);
      const parts = line.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return;
      const [cmd, ...args] = parts;
      const err = m => { print(m, 't-dim'); Sound.play('error'); };
      switch (cmd){
        case 'help':
          print('tungsh built-ins:'); print('  ls [path]      cd [path]     pwd           cat <file>');
          print('  mkdir <name>   touch <name>  rm [-r] <f>   echo <text>');
          print('  open <f|app>   apps          history       clear');
          print('  theme <d|l>    wallpaper <id|list>        date    uname');
          print('  whoami         neofetch     defender      sudo (lol)');
          print('  tung          (the important one)');
          break;
        case 'clear': out.innerHTML = ''; break;
        case 'pwd': print(pathOf(findNode(st.cwd)) || '/'); break;
        case 'whoami': print('sahur'); break;
        case 'date': print(new Date().toString()); break;
        case 'uname': print('SahurOS 2.0 tungtungtungsahur kernel-browser ' + (navigator.platform || 'web')); break;
        case 'ls': {
          const t = resolvePath(args[0] || '.', st.cwd);
          if (!t) return err('ls: no such path: ' + args[0]);
          if (t.type === 'file') return print(t.name);
          const kids = childrenOf(t.id);
          if (!kids.length) return print('(empty)', 't-dim');
          printHTML(kids.map(c => c.type === 'folder' ? `<span class="t-dir">${esc(c.name)}/</span>` : esc(c.name)).join('   '));
          break;
        }
        case 'cd': {
          const t = resolvePath(args[0] || '~', st.cwd);
          if (!t || t.type !== 'folder') return err('cd: not a directory: ' + (args[0] || ''));
          st.cwd = t.id; setPrompt();
          break;
        }
        case 'cat': {
          if (!args[0]) return err('cat: which file?');
          const t = resolvePath(args[0], st.cwd);
          if (!t || t.type !== 'file') return err('cat: no such file: ' + args[0]);
          if (t.kind === 'image') return print('[binary image data, ' + fmtBytes(t.content.length) + ' — open it in Preview]', 't-dim');
          const d = document.createElement('div'); d.innerHTML = t.content || '';
          print(d.textContent || '(empty file)');
          break;
        }
        case 'mkdir': {
          if (!args[0]) return err('mkdir: name required');
          if (childrenOf(st.cwd).some(c => c.name === args[0])) return err('mkdir: already exists: ' + args[0]);

const Restart = {
  el:null, count:null, barI:null, timer:null, keyH:null, remain:10, dels:0, paused:false, done:false,
  begin(){
    this.done = false; this.paused = false; this.remain = 10; this.dels = 0;
    Sound.play('glitch');
    document.body.classList.add('glitching');
    setTimeout(() => document.body.classList.remove('glitching'), 1000);
    this.count = h('div', { class:'sysx-count' }, '10');
    this.barI = h('i'); this.barI.style.width = '0%';
    this.el = h('div', { class:'sysx' },
      h('h2', {}, 'SAHUR OS'),
      h('div', { class:'sx-dim' }, 'Restoring system — DO NOT turn off your computer.'),
      this.count,
      h('div', { class:'sysx-bar' }, this.barI));
    document.body.append(this.el);
    this.timer = setInterval(() => this.tick(), 1000);
    this.keyH = e => {
      if (this.paused || this.done) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && !e.repeat){
        e.preventDefault(); e.stopPropagation();
        this.dels++; Sound.play('tick');
        if (this.dels >= 5) this.toBios();
      }
    };
    document.addEventListener('keydown', this.keyH, true);
    this.el.addEventListener('pointerdown', () => {
      if (this.paused || this.done) return;
      this.dels++; if (this.dels >= 5) this.toBios();
    });
  },
  tick(){
    if (this.paused || this.done) return;
    this.remain--;
    this.count.textContent = Math.max(0, this.remain);
    this.barI.style.width = ((10 - this.remain) * 10) + '%';
    if (this.remain === 4) this.sublim();
    if (this.remain <= 0) this.wipeNow();
  },
  sublim(){
    const s = h('div', { class:'sysx-sublim' }, 'DEL … DEL … DEL …');
    document.body.append(s); setTimeout(() => s.remove(), 170);
  },
  toBios(){
    this.paused = true;
    Sound.play('beep');
    enterBios(() => { this.paused = false; });
  },
  cancel(){
    this.done = true;
    clearInterval(this.timer);
    document.removeEventListener('keydown', this.keyH, true);
    if (this.el){ this.el.remove(); this.el = null; }
  },
  wipeNow(){
    this.done = true;
    clearInterval(this.timer);
    document.removeEventListener('keydown', this.keyH, true);
    this.el.innerHTML = '';
    this.el.append(h('div', { class:'sysx-wipe' }, 'wiping user data…'));
    Sound.play('siren');
    setTimeout(() => { this.el.style.background = '#000'; this.el.innerHTML = ''; }, 2200);
    setTimeout(() => wipeRun(), 3300);
  }
};

  DockFX.mouseX = e.clientX - r.left; DockFX.wake();
});
$('#dock').addEventListener('mouseleave', () => { DockFX.mouseX = null; DockFX.hideTip(); DockFX.wake(); });
_dockApps.addEventListener('mouseover', e => { const b = e.target.closest('.dock-btn'); if (b) DockFX.showTip(b); });
_dockApps.addEventListener('mouseout',  e => { if (e.target.closest('.dock-btn')) DockFX.hideTip(); });
 $('#clock').addEventListener('click', () => popover($('#clock'), buildCalendar));
 $('#qs-btn').addEventListener('click', () => popover($('#qs-btn'), buildQuickSettings));
 $('#sound-btn').addEventListener('click', () => {
  S().sound = !S().sound; Store.schedule(); renderDock();
  if (S().sound) Sound.play('tung');
});
function startClock(){
  const tick = () => {
    const d = new Date();
    const t = $('#clock-time'), dt = $('#clock-date');
    if (t) t.textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (dt) dt.textContent = d.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' });
  };
  setInterval(tick, 1000); tick();
}
window.addEventListener('resize', () => {
  WM.wins.forEach(w => {
    if (w.maximized){ const a = workArea(); setRect(w, a.x, a.y, a.w, a.h); }
    else setRect(w, clamp(w.el.offsetLeft, 150 - w.el.offsetWidth, innerWidth - 150),
      clamp(w.el.offsetTop, 0, Math.max(0, innerHeight - 48)), w.el.offsetWidth, w.el.offsetHeight);
  });
});

/* ===================== boot ===================== */
const BOOT_TIME = Date.now();
let booted = false;
function boot(){
  Store.load();
  applySettings();
  renderDesktop();
  renderDock();
  startClock();
  Bus.on('fs', () => renderDesktop());
  $('#boot-mascot').innerHTML = ASSETS.mascot ? `<img src="${ASSETS.mascot}" alt="mascot">` : mascotSVG({ w:120, h:160 });
  const LINES = ['tung.', 'tung tung.', 'tung tung tung.', 'SAHUR.', 'mounting Sahur Disk…', 'loading brainrot modules…', 'arming TUNG DEFENDER…', 'polishing the bat…'];
  const bootEl = $('#boot'), linesEl = $('#boot-lines'), barEl = $('#boot-bar'), hint = $('#boot-hint');
  let seq = null;
  const finish = () => {
    if (booted) return; booted = true;
    clearInterval(seq);
    bootEl.classList.add('off');
    setTimeout(() => bootEl.remove(), 600);
    if (Store.firstRun) setTimeout(() => toast('The last user left a note. Double-click "read me.txt" on the Desktop.', 'info'), 900);
  };
  bootEl.addEventListener('click', () => {
    if (seq) return finish(); // clicking during boot skips it
    Sound.init(); Sound.play('startup');
    startRunTimer();
    hint.style.display = 'none';
    let i = 0;
    linesEl.textContent = LINES[0]; barEl.style.width = '8%';
    seq = setInterval(() => {
      i++;
      if (i < LINES.length){ linesEl.textContent = LINES[i]; barEl.style.width = Math.round(8 + (i+1)/LINES.length * 88) + '%'; }
      else { barEl.style.width = '100%'; setTimeout(finish, 260); }
    }, 300);
  });
}
boot();
</script>
